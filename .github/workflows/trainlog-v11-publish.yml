name: Publish TrainLog v11

on:
  push:
    paths:
      - ".github/workflows/trainlog-v11-publish.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish and clean up TrainLog v11
        shell: bash
        run: |
          cat .github/trainlog-v11-payload/part-* | base64 --decode > /tmp/trainlog-v11.zip
          unzip -t /tmp/trainlog-v11.zip
          unzip -o /tmp/trainlog-v11.zip -d .
          node --check app.js
          node --check service-worker.js
          grep -q 'APP_VERSION = "11"' app.js
          grep -q 'trainlog-v11' service-worker.js
          grep -q 'app.js?v=11' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css service-worker.js manifest.webmanifest "使用说明.html"
          git rm -r .github/trainlog-v11-payload .github/workflows/trainlog-v11-publish.yml
          git commit -m "TrainLog v11: fix AI connection diagnostics"
          git push
