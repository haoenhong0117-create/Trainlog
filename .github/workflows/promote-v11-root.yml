name: Promote v11 root

on:
  push:
    paths:
      - .github/workflows/promote-v11-root.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote default entry to v11
        run: |
          perl -0pi -e 's/app\.js\?v=10/app.js?v=11/g' index.html
          perl -0pi -e 's/const APP_VERSION = "10";/const APP_VERSION = "11";/' app.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet; then
            echo "Root is already v11"
            exit 0
          fi
          git add index.html app.js
          git commit -m "Promote default app entry to v11"
          git push
