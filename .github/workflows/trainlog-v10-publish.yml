name: Publish TrainLog v10

on:
  push:
    paths:
      - ".github/workflows/trainlog-v10-publish.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify TrainLog v10
        shell: bash
        run: |
          cat > /tmp/trainlog-v10.patch.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/trainlog-v10.patch.gz.b64 | gzip -d > /tmp/trainlog-v10.patch
          git apply --check /tmp/trainlog-v10.patch
          git apply /tmp/trainlog-v10.patch
          node --check app.js
          node --check cloudflare-sync-worker.js
          node --check service-worker.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css cloudflare-sync-worker.js service-worker.js manifest.webmanifest "使用说明.html"
          git commit -m "TrainLog v10: enforce accurate nutrition analysis"
          git push
